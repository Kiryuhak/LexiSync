name: Проверка LexiSync

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            LEXISYNC_GOOGLE_DRIVE_CHROME_CLIENT_ID: chrome-ci-client.apps.googleusercontent.com
            LEXISYNC_GOOGLE_DRIVE_FIREFOX_CLIENT_ID: firefox-ci-client.apps.googleusercontent.com
        steps:
            - name: Получить код
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Установить Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: npm

            - name: Установить зависимости
              run: npm ci

            - name: Проверить код, типы, форматирование и локализацию
              run: |
                  echo "::group::Статическая проверка кода, типов, Prettier и i18n"
                  npm run check:static
                  echo "::endgroup::"

            - name: Проверить production-зависимости
              run: |
                  echo "::group::Проверка production-зависимостей (npm audit)"
                  npm run audit:dependencies
                  echo "::endgroup::"

            - name: Проверить инструменты сборки
              run: |
                  echo "::group::Проверка инструментов сборки"
                  npm run audit:tooling
                  echo "::endgroup::"

            - name: Запустить модульные тесты
              run: |
                  echo "::group::Модульные тесты и сбор отчёта покрытия (Vitest)"
                  npm run test:coverage
                  echo "::endgroup::"

            - name: Собрать финальные production-архивы
              run: |
                  echo "::group::Сборка production-архивов Chrome и Firefox"
                  npm run zip
                  echo "::endgroup::"

            - name: Проверить манифесты и содержимое production-архивов
              run: |
                  echo "::group::Верификация содержимого архивов и манифестов MV3"
                  npm run verify:artifacts
                  echo "::endgroup::"

            - name: Проверить финальную Firefox-сборку для Add-ons
              run: |
                  echo "::group::Линтинг сборки Firefox с помощью web-ext"
                  npm run lint:firefox
                  echo "::endgroup::"

            - name: Установить тестовые браузеры
              run: |
                  echo "::group::Установка браузеров Chromium и Firefox для Playwright"
                  npx playwright install --with-deps chromium firefox
                  echo "::endgroup::"

            - name: Собрать изолированные E2E-артефакты
              run: |
                  echo "::group::Сборка изолированных E2E-артефактов"
                  npm run build:e2e
                  echo "::endgroup::"

            - name: Проверить Chrome
              run: |
                  echo "::group::Сквозные E2E тесты Chrome"
                  npm run test:e2e:only
                  echo "::endgroup::"

            - name: Проверить Firefox
              run: |
                  echo "::group::Сквозные тесты Firefox"
                  npm run test:firefox:only
                  echo "::endgroup::"

            - name: Сохранить диагностику E2E
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: e2e-diagnostics
                  path: |
                      test-results/**
                      playwright-report/**
                  retention-days: 7
                  if-no-files-found: ignore

            - name: Сохранить сборки
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: lexisync-builds
                  path: .output/release/*.zip
                  retention-days: 14

            - name: Сохранить отчёт покрытия
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: coverage-summary
                  path: coverage/coverage-summary.json
                  retention-days: 14
                  if-no-files-found: ignore

            - name: Сформировать сводный отчёт проверки CI
              if: always()
              shell: bash
              run: |
                  echo "::group::Формирование сводного отчёта шага GitHub Actions"
                  VERSION="$(node -p "require('./package.json').version")"
                  COMMIT_SHORT="${GITHUB_SHA::7}"
                  STATUS="${{ job.status }}"

                  {
                    echo "## 📊 Сводка проверки LexiSync CI"
                    echo ""
                    echo "| Параметр | Значение |"
                    echo "| :--- | :--- |"
                    echo "| **Версия пакета** | \`v${VERSION}\` |"
                    echo "| **Ветка** | \`${GITHUB_REF_NAME}\` |"
                    echo "| **Коммит** | \`${COMMIT_SHORT}\` |"
                    echo "| **Результат проверки** | \`${STATUS}\` |"
                    echo ""
                    echo "### 📦 Сборки и контрольные суммы SHA-256"
                    echo ""
                    if compgen -G ".output/release/*.zip" > /dev/null; then
                      echo "| Файл | Размер | SHA-256 |"
                      echo "| :--- | :--- | :--- |"
                      for file in .output/release/*.zip; do
                        fname=$(basename "$file")
                        fsize=$(ls -lh "$file" | awk '{print $5}')
                        fsha=$(sha256sum "$file" | awk '{print $1}')
                        echo "| \`$fname\` | $fsize | \`$fsha\` |"
                      done
                    else
                      echo "_Архивы релизов не были созданы._"
                    fi
                  } >> "$GITHUB_STEP_SUMMARY"
                  echo "::endgroup::"
