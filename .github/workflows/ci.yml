name: Проверка LexiSync

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - name: Получить код
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Установить Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: npm

            - name: Установить зависимости
              run: npm ci

            - name: Проверить код, типы, форматирование и локализацию
              run: npm run check:static

            - name: Проверить production-зависимости
              run: npm run audit:dependencies

            - name: Проверить инструменты сборки
              run: npm run audit:tooling

            - name: Запустить модульные тесты
              run: npm run test:coverage

            - name: Собрать финальные production-архивы
              run: npm run zip

            - name: Проверить манифесты и содержимое production-архивов
              run: npm run verify:artifacts

            - name: Проверить финальную Firefox-сборку для Add-ons
              run: npm run lint:firefox

            - name: Установить тестовые браузеры
              run: npx playwright install --with-deps chromium firefox

            - name: Собрать изолированные E2E-артефакты
              run: npm run build:e2e

            - name: Проверить Chrome
              run: xvfb-run -a npm run test:e2e:only

            - name: Проверить Firefox
              run: npm run test:firefox:only

            - name: Сохранить диагностику E2E
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: e2e-diagnostics
                  path: |
                      test-results/**
                      playwright-report/**
                  retention-days: 7
                  if-no-files-found: ignore

            - name: Сохранить сборки
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: lexisync-builds
                  path: .output/release/*.zip
                  retention-days: 14

            - name: Сохранить отчёт покрытия
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: coverage-summary
                  path: coverage/coverage-summary.json
                  retention-days: 14
                  if-no-files-found: ignore
