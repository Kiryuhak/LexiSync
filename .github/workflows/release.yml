name: Релиз LexiSync

on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            publish_firefox:
                description: Отправить Firefox-сборку в Mozilla Add-ons
                type: boolean
                default: false
            publish_chrome:
                description: Отправить Chrome-сборку в Chrome Web Store
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    verify-and-release:
        runs-on: ubuntu-latest
        timeout-minutes: 35
        permissions:
            contents: write
        outputs:
            tag: ${{ steps.release_meta.outputs.tag }}
            version: ${{ steps.release_meta.outputs.version }}
        steps:
            - name: Получить код
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Установить Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: npm

            - name: Установить зависимости
              run: npm ci

            - name: Проверить версию и тег релиза
              id: release_meta
              shell: bash
              run: |
                  VERSION="$(node -p "require('./package.json').version")"
                  TAG="v${VERSION}"
                  if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${TAG}" ]]; then
                    echo "Тег ${GITHUB_REF_NAME} не совпадает с версией ${VERSION}" >&2
                    exit 1
                  fi
                  echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

            - name: Установить браузеры
              run: npx playwright install --with-deps chromium firefox

            - name: Полностью проверить релиз
              run: xvfb-run -a npm run test:all

            - name: Сохранить проверенные архивы релиза
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: release-build-${{ steps.release_meta.outputs.version }}
                  path: .output/release
                  include-hidden-files: true
                  retention-days: 3
                  if-no-files-found: error

            - name: Сохранить диагностику E2E
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: release-e2e-diagnostics
                  path: |
                      test-results/**
                      playwright-report/**
                  retention-days: 7
                  if-no-files-found: ignore

            - name: Создать GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
              shell: bash
              run: |
                  # Попытка создания релиза с повторами при сбоях GitHub API (503 / network)
                  for attempt in {1..5}; do
                    if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                      break
                    fi
                    if gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes --title "LexiSync ${RELEASE_TAG#v}"; then
                      break
                    fi
                    if [[ "$attempt" -eq 5 ]]; then
                      echo "Не удалось создать GitHub Release после 5 попыток" >&2
                      exit 1
                    fi
                    echo "Попытка $attempt создания GitHub Release не удалась, ожидание перед повтором..." >&2
                    sleep 5
                  done

                  # Попытка загрузки архивов с повторами
                  for attempt in {1..5}; do
                    if gh release upload "$RELEASE_TAG" .output/release/*.zip --clobber; then
                      break
                    fi
                    if [[ "$attempt" -eq 5 ]]; then
                      echo "Не удалось загрузить архивы в GitHub Release после 5 попыток" >&2
                      exit 1
                    fi
                    echo "Попытка $attempt загрузки ассетов не удалась, ожидание перед повтором..." >&2
                    sleep 5
                  done

    publish-firefox:
        needs: verify-and-release
        if: ${{ github.event_name == 'push' || vars.PUBLISH_FIREFOX_AMO == 'true' || inputs.publish_firefox == true }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Получить код
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Установить Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: npm

            - name: Установить зависимости для публикации
              run: npm ci

            - name: Получить проверенные архивы релиза
              uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
              with:
                  name: release-build-${{ needs.verify-and-release.outputs.version }}
                  path: .output/release

            - name: Отправить расширение в Mozilla Add-ons
              env:
                  FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
                  FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
                  VERSION: ${{ needs.verify-and-release.outputs.version }}
              shell: bash
              run: |
                  output=$(npx web-ext sign \
                    --source-dir ".output/release/firefox-mv3" \
                    --artifacts-dir ".output/firefox-submission" \
                    --channel listed \
                    --api-key "$FIREFOX_JWT_ISSUER" \
                    --api-secret "$FIREFOX_JWT_SECRET" \
                    --amo-metadata "scripts/firefox-amo-metadata.json" \
                    --upload-source-code ".output/release/lexisync-extension-${VERSION}-sources.zip" \
                    --approval-timeout 0 \
                    --no-input 2>&1) || {
                    if echo "$output" | grep -q "already exists"; then
                      echo "Версия ${VERSION} уже загружена в Mozilla Add-ons — пропускаем повторную отправку."
                      exit 0
                    fi
                    echo "$output" >&2
                    exit 1
                  }
                  echo "$output"

    publish-chrome:
        needs: verify-and-release
        if: ${{ github.event_name == 'push' || vars.PUBLISH_CHROME_STORE == 'true' || inputs.publish_chrome == true }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Получить код
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Установить Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: npm

            - name: Получить проверенный архив релиза
              uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
              with:
                  name: release-build-${{ needs.verify-and-release.outputs.version }}
                  path: .output/release

            - name: Отправить расширение в Chrome Web Store
              env:
                  CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
                  CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
                  CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
                  CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
                  CHROME_EXPECTED_VERSION: ${{ needs.verify-and-release.outputs.version }}
                  CHROME_ZIP: .output/release/LexiSync-v${{ needs.verify-and-release.outputs.version }}-chrome.zip
                  CHROME_MAX_ATTEMPTS: 3
                  CHROME_POLL_ATTEMPTS: 12
                  CHROME_POLL_DELAY_MS: 2500
                  CHROME_RETRY_DELAY_MS: 3000
              run: node scripts/publish-chrome-store.mjs
