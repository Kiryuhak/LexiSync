<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">LexiSync — умная работа с текстом</title>
  <desc id="description">Анимированная обложка в стиле жидкого стекла</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a48" />
      <stop offset="0.48" stop-color="#30308c" />
      <stop offset="1" stop-color="#0e6a83" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity="0.24" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.07" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8c6cff" />
      <stop offset="0.5" stop-color="#4fa9ff" />
      <stop offset="1" stop-color="#43e0c1" />
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="42" /></filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#030719" flood-opacity="0.42" />
    </filter>
  </defs>
  <style>
    .orb-a, .orb-b, .spark, .underline { transform-box: fill-box; transform-origin: center; }
    .orb-a { animation: drift-a 9s ease-in-out infinite alternate; }
    .orb-b { animation: drift-b 11s ease-in-out infinite alternate; }
    .spark { animation: pulse 2.8s ease-in-out infinite; }
    .spark:nth-of-type(2n) { animation-delay: -1.4s; }
    .underline { animation: breathe 3.6s ease-in-out infinite; }
    @keyframes drift-a { to { transform: translate(90px, 24px) scale(1.16); } }
    @keyframes drift-b { to { transform: translate(-78px, -18px) scale(0.88); } }
    @keyframes pulse { 50% { opacity: 0.28; transform: scale(0.72); } }
    @keyframes breathe { 50% { transform: scaleX(0.78); opacity: 0.72; } }
    @media (prefers-reduced-motion: reduce) {
      .orb-a, .orb-b, .spark, .underline { animation: none; }
    }
  </style>
  <rect width="1200" height="360" rx="34" fill="url(#background)" />
  <circle class="orb-a" cx="205" cy="70" r="155" fill="#795cff" opacity="0.62" filter="url(#blur)" />
  <circle class="orb-b" cx="1010" cy="292" r="180" fill="#27d6c4" opacity="0.5" filter="url(#blur)" />
  <circle class="orb-b" cx="945" cy="20" r="110" fill="#2c8cff" opacity="0.36" filter="url(#blur)" />
  <g fill="#ffffff">
    <circle class="spark" cx="126" cy="250" r="4" opacity="0.8" />
    <circle class="spark" cx="1070" cy="92" r="5" opacity="0.72" />
    <circle class="spark" cx="1015" cy="255" r="3" opacity="0.65" />
    <circle class="spark" cx="244" cy="102" r="3" opacity="0.7" />
  </g>
  <g filter="url(#shadow)">
    <rect x="214" y="62" width="772" height="236" rx="34" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.32" />
    <rect x="234" y="82" width="732" height="196" rx="25" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.13" />
  </g>
  <g transform="translate(278 113)">
    <rect width="78" height="78" rx="23" fill="url(#accent)" />
    <path d="M39 16c2.3 11.8 9.2 18.7 21 21-11.8 2.3-18.7 9.2-21 21-2.3-11.8-9.2-18.7-21-21 11.8-2.3 18.7-9.2 21-21Z" fill="#fff" />
  </g>
  <text x="386" y="158" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-1.5">LexiSync</text>
  <rect class="underline" x="387" y="174" width="304" height="5" rx="2.5" fill="url(#accent)" />
  <text x="278" y="229" fill="#f3f7ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="500">Умная работа с текстом прямо в браузере</text>
  <text x="278" y="261" fill="#dce7ff" opacity="0.82" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Vanilla DOM · TypeScript · Chrome · Firefox</text>
</svg>
