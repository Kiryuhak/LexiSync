<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title data-i18n="historyPageTitle">История LexiSync</title>
        <style>
            :root {
                color-scheme: light;
                --bg: #f8f9fa;
                --card: #fff;
                --text: #202124;
                --muted: #5f6368;
                --border: #dadce0;
                --soft: #f1f3f4;
                --result: #e6f4ea;
                --result-text: #137333;
                --accent: #1a73e8;
            }
            [data-theme='dark'] {
                color-scheme: dark;
                --bg: #12131a;
                --card: #1d1f2a;
                --text: #f1f3f8;
                --muted: #a8afc1;
                --border: #3b3f50;
                --soft: #282b38;
                --result: #18382a;
                --result-text: #81d6a9;
                --accent: #8ab4f8;
            }
            body {
                font-family: system-ui, sans-serif;
                background: var(--bg);
                color: var(--text);
                padding: 40px;
                margin: 0;
            }
            .container {
                max-width: 900px;
                margin: 0 auto;
            }
            h1 {
                color: var(--accent);
                font-size: 24px;
                margin-bottom: 16px;
            }
            .toolbar {
                display: grid;
                grid-template-columns: minmax(220px, 1fr) 180px auto auto auto;
                gap: 10px;
                margin-bottom: 24px;
            }
            .toolbar input,
            .toolbar select {
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 9px 12px;
                background: var(--card);
                font: inherit;
                color: inherit;
            }
            .history-card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 20px;
                margin-bottom: 16px;
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            }
            .history-card.is-favorite {
                border-color: #f4b400;
            }
            .history-header {
                display: flex;
                justify-content: space-between;
                margin-bottom: 12px;
                font-size: 13px;
                color: var(--muted);
            }
            .mode-badge {
                background: #e8f0fe;
                color: #1967d2;
                padding: 4px 8px;
                border-radius: 6px;
                font-weight: 600;
                text-transform: uppercase;
            }
            .text-block {
                margin-bottom: 12px;
            }
            .label {
                font-size: 12px;
                font-weight: 600;
                color: #9aa0a6;
                text-transform: uppercase;
                margin-bottom: 4px;
            }
            .content {
                font-size: 14px;
                line-height: 1.5;
                white-space: pre-wrap;
                background: var(--soft);
                padding: 12px;
                border-radius: 8px;
                font-family: inherit;
            }
            .content.result {
                background: var(--result);
                color: var(--result-text);
                border: 1px solid var(--border);
            }
            .empty {
                text-align: center;
                color: var(--muted);
                margin-top: 40px;
                font-size: 16px;
            }
            button {
                color: var(--text);
                background: var(--card);
                border: 1px solid var(--border);
                padding: 8px 12px;
                border-radius: 8px;
                cursor: pointer;
                font-weight: 500;
                transition: 0.2s;
            }
            button[aria-pressed='true'] {
                color: #8a5a00;
                background: #fff4ce;
                border-color: #f4b400;
            }
            button:focus-visible,
            input:focus-visible,
            select:focus-visible {
                outline: 3px solid rgba(26, 115, 232, 0.3);
                outline-offset: 2px;
            }
            button.clear-btn,
            .delete-btn {
                color: #d93025;
            }
            button.clear-btn:hover {
                background: #fce8e6;
            }
            button:disabled {
                cursor: progress;
                opacity: 0.62;
            }
            .card-actions {
                display: flex;
                gap: 8px;
                justify-content: flex-end;
            }
            .history-status {
                margin: -12px 0 18px;
                padding: 10px 12px;
                border: 1px solid var(--border);
                border-radius: 10px;
                background: var(--card);
                color: var(--muted);
                font-size: 14px;
            }
            .history-status:empty {
                display: none;
            }
            .history-status[data-kind='success'] {
                color: var(--result-text);
                background: var(--result);
            }
            .history-status[data-kind='error'] {
                color: #b42318;
                background: #fff1f0;
                border-color: #f1b8b3;
            }
            [data-theme='dark'] .history-status[data-kind='error'] {
                color: #ffb4ab;
                background: #4a2020;
                border-color: #7b3a36;
            }
            .secondary-btn:hover {
                background: #e8f0fe;
                color: #1967d2;
            }
            .delete-btn:hover {
                background: #fce8e6;
            }
            .hidden {
                display: none !important;
            }
            [data-ui-style='magicos-11'] {
                --bg: #dfeaff;
                --card: rgba(249, 252, 255, 0.62);
                --text: #17213a;
                --muted: #52617d;
                --border: rgba(255, 255, 255, 0.78);
                --soft: rgba(255, 255, 255, 0.46);
                --result: rgba(218, 247, 237, 0.7);
                --result-text: #176846;
                --accent: #4267f5;
            }
            [data-ui-style='magicos-11'][data-theme='dark'] {
                --bg: #11182a;
                --card: rgba(27, 36, 60, 0.7);
                --text: #f6f8ff;
                --muted: #b7c3dc;
                --border: rgba(255, 255, 255, 0.18);
                --soft: rgba(55, 70, 108, 0.46);
                --result: rgba(26, 86, 65, 0.56);
                --result-text: #9ee2c5;
                --accent: #9eb4ff;
            }
            [data-ui-style='magicos-11'] body {
                background:
                    radial-gradient(circle at 12% 8%, rgba(114, 154, 255, 0.68), transparent 34%),
                    radial-gradient(circle at 88% 16%, rgba(110, 225, 242, 0.46), transparent 31%),
                    radial-gradient(circle at 68% 92%, rgba(170, 120, 255, 0.36), transparent 38%), var(--bg);
                background-attachment: fixed;
            }
            [data-ui-style='magicos-11'] .history-card,
            [data-ui-style='magicos-11'] .toolbar input,
            [data-ui-style='magicos-11'] .toolbar select,
            [data-ui-style='magicos-11'] button,
            [data-ui-style='magicos-11'] .content {
                border-color: var(--border);
                border-radius: 20px;
                box-shadow:
                    0 14px 36px rgba(37, 59, 116, 0.16),
                    inset 0 1px 0 rgba(255, 255, 255, 0.58);
                backdrop-filter: blur(24px) saturate(170%);
                -webkit-backdrop-filter: blur(24px) saturate(170%);
            }
            [data-ui-style='magicos-11'] button,
            [data-ui-style='magicos-11'] .mode-badge {
                border-radius: 999px;
            }

            [data-ui-style='material-3'] {
                --bg: #f4f6f8;
                --card: #fff;
                --text: #1d1b20;
                --muted: #49454f;
                --border: #c8cdd4;
                --soft: #f1f3f6;
                --accent: #6750a4;
            }
            [data-ui-style='material-3'][data-theme='dark'] {
                --bg: #15171a;
                --card: #1d2024;
                --text: #f2f4f7;
                --muted: #c5cad1;
                --border: #454b54;
                --soft: #272b30;
                --accent: #c7b8ff;
            }
            [data-ui-style='material-3'] .history-card {
                border-radius: 24px;
                box-shadow: 0 3px 8px rgba(29, 25, 43, 0.14);
            }
            [data-ui-style='material-3'] button,
            [data-ui-style='material-3'] input,
            [data-ui-style='material-3'] select,
            [data-ui-style='material-3'] .content {
                border-radius: 16px;
            }
            [data-ui-style='flutter'] {
                --bg: #eef5fb;
                --card: #fff;
                --text: #17212b;
                --muted: #607080;
                --border: #d7e0e8;
                --soft: #f1f6fb;
                --accent: #1976d2;
            }
            [data-ui-style='flutter'][data-theme='dark'] {
                --bg: #161b20;
                --card: #20252b;
                --text: #f3f6f9;
                --muted: #aebbc7;
                --border: #43505c;
                --soft: #2b333b;
                --accent: #64b5f6;
            }
            [data-ui-style='flutter'] .history-card {
                border-radius: 10px;
                box-shadow: 0 7px 18px rgba(32, 73, 105, 0.12);
            }
            [data-ui-style='aurora-glass'] {
                --bg: #dff6ef;
                --card: rgba(248, 255, 252, 0.78);
                --text: #183d39;
                --muted: #58746f;
                --border: rgba(255, 255, 255, 0.84);
                --soft: rgba(233, 250, 245, 0.74);
                --accent: #0d9d8a;
            }
            [data-ui-style='aurora-glass'][data-theme='dark'] {
                --bg: #0b292d;
                --card: rgba(18, 47, 52, 0.82);
                --text: #e9fffa;
                --muted: #b5d2cc;
                --border: rgba(196, 255, 245, 0.2);
                --soft: rgba(40, 82, 83, 0.72);
                --accent: #65dfc8;
            }
            [data-ui-style='aurora-glass'] body {
                background:
                    radial-gradient(circle at 12% 4%, rgba(76, 219, 183, 0.58), transparent 36%),
                    radial-gradient(circle at 88% 90%, rgba(86, 168, 255, 0.42), transparent 42%), var(--bg);
                background-attachment: fixed;
            }
            [data-ui-style='aurora-glass'] .history-card {
                border-radius: 18px;
                box-shadow:
                    0 16px 36px rgba(23, 108, 98, 0.18),
                    inset 0 1px 0 rgba(255, 255, 255, 0.7);
                backdrop-filter: blur(20px) saturate(145%);
                -webkit-backdrop-filter: blur(20px) saturate(145%);
            }
            [data-ui-style='aurora-glass'] button,
            [data-ui-style='aurora-glass'] input,
            [data-ui-style='aurora-glass'] select,
            [data-ui-style='aurora-glass'] .content {
                border-radius: 12px;
            }
            @media (max-width: 720px) {
                body {
                    padding: 20px;
                }
                .toolbar {
                    grid-template-columns: 1fr;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                button {
                    transition: none;
                }
            }
        </style>
    </head>
    <body>
        <main class="container">
            <h1 data-i18n="historyTitle">История запросов</h1>
            <div class="toolbar">
                <input
                    id="historySearch"
                    type="search"
                    placeholder="Поиск по истории…"
                    data-i18n-placeholder="historySearch"
                />
                <select id="modeFilter" aria-label="Все операции" data-i18n-aria-label="allOperations">
                    <option value="all" data-i18n="allOperations">Все операции</option>
                    <option value="spellcheck" data-i18n="modeSpellcheck">Ошибки</option>
                    <option value="style" data-i18n="modeStyle">Стиль</option>
                    <option value="emoji" data-i18n="modeEmoji">Эмодзи</option>
                    <option value="layout" data-i18n="modeLayout">Раскладка</option>
                    <option value="translate" data-i18n="modeTranslate">Перевод</option>
                    <option value="summary" data-i18n="summaryShort">Выжимка</option>
                    <option value="reply" data-i18n="modeReply">Ответ</option>
                    <option value="explain" data-i18n="modeExplain">Объяснить</option>
                    <option value="format" data-i18n="modeFormat">Формат</option>
                    <option value="ocr">OCR</option>
                    <option value="custom" data-i18n="modeCustom">Команда</option>
                </select>
                <select id="historySort" aria-label="Sort history" data-i18n-aria-label="historySort">
                    <option value="newest" data-i18n="historySortNewest">Newest first</option>
                    <option value="oldest" data-i18n="historySortOldest">Oldest first</option>
                    <option value="favorites" data-i18n="historySortFavorites">Favorites first</option>
                </select>
                <button id="favoriteFilter" type="button" aria-pressed="false" data-i18n="favoritesOnly">
                    Только избранное
                </button>
                <button id="resetFilterBtn" type="button" data-i18n="resetFilters">Сбросить фильтры</button>
                <button id="exportBtn" data-i18n="exportJson">Экспорт JSON</button>
                <button id="clearBtn" class="clear-btn" data-i18n="clear">Очистить</button>
            </div>
            <p id="historyStatus" class="history-status" role="status" aria-live="polite" aria-atomic="true"></p>
            <div id="historyList"></div>
        </main>
        <script type="module" src="/src/history.ts"></script>
    </body>
</html>
