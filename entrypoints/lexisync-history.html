<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title data-i18n="historyPageTitle">История LexiSync</title>
        <style>
            :root {
                color-scheme: light;
                --bg: #f8f9fa;
                --card: #fff;
                --text: #202124;
                --muted: #5f6368;
                --border: #dadce0;
                --soft: #f1f3f4;
                --result: #e6f4ea;
                --result-text: #137333;
                --accent: #1a73e8;
            }
            [data-theme='dark'] {
                color-scheme: dark;
                --bg: #12131a;
                --card: #1d1f2a;
                --text: #f1f3f8;
                --muted: #a8afc1;
                --border: #3b3f50;
                --soft: #282b38;
                --result: #18382a;
                --result-text: #81d6a9;
                --accent: #8ab4f8;
            }
            body {
                font-family: system-ui, sans-serif;
                background: var(--bg);
                color: var(--text);
                padding: 40px;
                margin: 0;
            }
            .container {
                max-width: 900px;
                margin: 0 auto;
            }
            h1 {
                color: var(--accent);
                font-size: 24px;
                margin-bottom: 16px;
            }
            .toolbar {
                display: grid;
                grid-template-columns: minmax(220px, 1fr) 180px auto auto auto;
                gap: 10px;
                margin-bottom: 24px;
            }
            .toolbar input,
            .toolbar select {
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 9px 12px;
                background: var(--card);
                font: inherit;
                color: inherit;
            }
            .history-card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 20px;
                margin-bottom: 16px;
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            }
            .history-card.is-favorite {
                border-color: #f4b400;
            }
            .history-header {
                display: flex;
                justify-content: space-between;
                margin-bottom: 12px;
                font-size: 13px;
                color: var(--muted);
            }
            .mode-badge {
                background: #e8f0fe;
                color: #1967d2;
                padding: 4px 8px;
                border-radius: 6px;
                font-weight: 600;
                text-transform: uppercase;
            }
            .text-block {
                margin-bottom: 12px;
            }
            .label {
                font-size: 12px;
                font-weight: 600;
                color: #9aa0a6;
                text-transform: uppercase;
                margin-bottom: 4px;
            }
            .content {
                font-size: 14px;
                line-height: 1.5;
                white-space: pre-wrap;
                background: var(--soft);
                padding: 12px;
                border-radius: 8px;
                font-family: inherit;
            }
            .content.result {
                background: var(--result);
                color: var(--result-text);
                border: 1px solid var(--border);
            }
            .empty {
                text-align: center;
                color: var(--muted);
                margin-top: 40px;
                font-size: 16px;
            }
            button {
                color: var(--text);
                background: var(--card);
                border: 1px solid var(--border);
                padding: 8px 12px;
                border-radius: 8px;
                cursor: pointer;
                font-weight: 500;
                transition: 0.2s;
            }
            button[aria-pressed='true'] {
                color: #8a5a00;
                background: #fff4ce;
                border-color: #f4b400;
            }
            button:focus-visible,
            input:focus-visible,
            select:focus-visible {
                outline: 3px solid rgba(26, 115, 232, 0.3);
                outline-offset: 2px;
            }
            button.clear-btn,
            .delete-btn {
                color: #d93025;
            }
            button.clear-btn:hover {
                background: #fce8e6;
            }
            .card-actions {
                display: flex;
                gap: 8px;
                justify-content: flex-end;
            }
            .secondary-btn:hover {
                background: #e8f0fe;
                color: #1967d2;
            }
            .delete-btn:hover {
                background: #fce8e6;
            }
            .hidden {
                display: none !important;
            }
            [data-ui-style='magicos-11'] {
                --bg: #dfeaff;
                --card: rgba(249, 252, 255, 0.62);
                --text: #17213a;
                --muted: #52617d;
                --border: rgba(255, 255, 255, 0.78);
                --soft: rgba(255, 255, 255, 0.46);
                --result: rgba(218, 247, 237, 0.7);
                --result-text: #176846;
                --accent: #4267f5;
            }
            [data-ui-style='magicos-11'][data-theme='dark'] {
                --bg: #11182a;
                --card: rgba(27, 36, 60, 0.7);
                --text: #f6f8ff;
                --muted: #b7c3dc;
                --border: rgba(255, 255, 255, 0.18);
                --soft: rgba(55, 70, 108, 0.46);
                --result: rgba(26, 86, 65, 0.56);
                --result-text: #9ee2c5;
                --accent: #9eb4ff;
            }
            [data-ui-style='magicos-11'] body {
                background:
                    radial-gradient(circle at 12% 8%, rgba(114, 154, 255, 0.68), transparent 34%),
                    radial-gradient(circle at 88% 16%, rgba(110, 225, 242, 0.46), transparent 31%),
                    radial-gradient(circle at 68% 92%, rgba(170, 120, 255, 0.36), transparent 38%), var(--bg);
                background-attachment: fixed;
            }
            [data-ui-style='magicos-11'] .history-card,
            [data-ui-style='magicos-11'] .toolbar input,
            [data-ui-style='magicos-11'] .toolbar select,
            [data-ui-style='magicos-11'] button,
            [data-ui-style='magicos-11'] .content {
                border-color: var(--border);
                border-radius: 20px;
                box-shadow:
                    0 14px 36px rgba(37, 59, 116, 0.16),
                    inset 0 1px 0 rgba(255, 255, 255, 0.58);
                backdrop-filter: blur(24px) saturate(170%);
                -webkit-backdrop-filter: blur(24px) saturate(170%);
            }
            [data-ui-style='magicos-11'] button,
            [data-ui-style='magicos-11'] .mode-badge {
                border-radius: 999px;
            }

            [data-ui-style='material-3'] {
                --bg: #f4f6f8;
                --card: #fff;
                --text: #1d1b20;
                --muted: #49454f;
                --border: #c8cdd4;
                --soft: #f1f3f6;
                --accent: #6750a4;
            }
            [data-ui-style='material-3'][data-theme='dark'] {
                --bg: #15171a;
                --card: #1d2024;
                --text: #f2f4f7;
                --muted: #c5cad1;
                --border: #454b54;
                --soft: #272b30;
                --accent: #c7b8ff;
            }
            [data-ui-style='material-3'] .history-card {
                border-radius: 24px;
                box-shadow: 0 3px 8px rgba(29, 25, 43, 0.14);
            }
            [data-ui-style='material-3'] button,
            [data-ui-style='material-3'] input,
            [data-ui-style='material-3'] select,
            [data-ui-style='material-3'] .content {
                border-radius: 16px;
            }
            [data-ui-style='flutter'] {
                --bg: #eef5fb;
                --card: #fff;
                --text: #17212b;
                --muted: #607080;
                --border: #d7e0e8;
                --soft: #f1f6fb;
                --accent: #1976d2;
            }
            [data-ui-style='flutter'][data-theme='dark'] {
                --bg: #161b20;
                --card: #20252b;
                --text: #f3f6f9;
                --muted: #aebbc7;
                --border: #43505c;
                --soft: #2b333b;
                --accent: #64b5f6;
            }
            [data-ui-style='flutter'] .history-card {
                border-radius: 10px;
                box-shadow: 0 7px 18px rgba(32, 73, 105, 0.12);
            }
            [data-ui-style='bento'] {
                --bg: #f3f5f8;
                --card: #fff;
                --text: #20242c;
                --muted: #667085;
                --border: #2d3648;
                --soft: #f5f7fa;
                --accent: #6d5ce7;
            }
            [data-ui-style='bento'][data-theme='dark'] {
                --bg: #171a1f;
                --card: #20242b;
                --text: #f7f9fc;
                --muted: #c4cbd6;
                --border: #d7dde8;
                --soft: #303640;
                --accent: #b7abff;
            }
            [data-ui-style='bento'] .history-card {
                border-width: 2px;
                border-radius: 18px;
                box-shadow: 6px 6px 0 rgba(43, 38, 51, 0.16);
            }
            [data-ui-style='bento'] button,
            [data-ui-style='bento'] input,
            [data-ui-style='bento'] select,
            [data-ui-style='bento'] .content {
                border-width: 2px;
                border-radius: 11px;
            }
            @media (max-width: 720px) {
                body {
                    padding: 20px;
                }
                .toolbar {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>
    <body>
        <main class="container">
            <h1 data-i18n="historyTitle">История запросов</h1>
            <div class="toolbar">
                <input
                    id="historySearch"
                    type="search"
                    placeholder="Поиск по истории…"
                    data-i18n-placeholder="historySearch"
                />
                <select id="modeFilter" aria-label="Все операции" data-i18n-aria-label="allOperations">
                    <option value="all" data-i18n="allOperations">Все операции</option>
                    <option value="spellcheck" data-i18n="modeSpellcheck">Ошибки</option>
                    <option value="style" data-i18n="modeStyle">Стиль</option>
                    <option value="emoji" data-i18n="modeEmoji">Эмодзи</option>
                    <option value="layout" data-i18n="modeLayout">Раскладка</option>
                    <option value="translate" data-i18n="modeTranslate">Перевод</option>
                    <option value="ocr">OCR</option>
                    <option value="custom" data-i18n="modeCustom">Команда</option>
                </select>
                <button id="favoriteFilter" type="button" aria-pressed="false" data-i18n="favoritesOnly">
                    Только избранное
                </button>
                <button id="exportBtn" data-i18n="exportJson">Экспорт JSON</button>
                <button id="clearBtn" class="clear-btn" data-i18n="clear">Очистить</button>
            </div>
            <div id="historyList"></div>
        </main>
        <script type="module" src="/src/history.ts"></script>
    </body>
</html>
