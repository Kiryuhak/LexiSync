<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title data-i18n="historyPageTitle">История LexiSync</title>
        <style>
            :root {
                color-scheme: light;
                --bg: #f8f9fa;
                --card: #fff;
                --text: #202124;
                --muted: #5f6368;
                --border: #dadce0;
                --soft: #f1f3f4;
                --result: #e6f4ea;
                --result-text: #137333;
                --accent: #1a73e8;
            }
            [data-theme='dark'] {
                color-scheme: dark;
                --bg: #12131a;
                --card: #1d1f2a;
                --text: #f1f3f8;
                --muted: #a8afc1;
                --border: #3b3f50;
                --soft: #282b38;
                --result: #18382a;
                --result-text: #81d6a9;
                --accent: #8ab4f8;
            }
            body {
                font-family: system-ui, sans-serif;
                background: var(--bg);
                color: var(--text);
                padding: 40px;
                margin: 0;
            }
            .container {
                max-width: 900px;
                margin: 0 auto;
            }
            h1 {
                color: var(--accent);
                font-size: 24px;
                margin-bottom: 16px;
            }
            .toolbar {
                display: grid;
                grid-template-columns: minmax(220px, 1fr) 180px auto auto auto;
                gap: 10px;
                margin-bottom: 24px;
            }
            .toolbar input,
            .toolbar select {
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 9px 12px;
                background: var(--card);
                font: inherit;
                color: inherit;
            }
            .history-card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 20px;
                margin-bottom: 16px;
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            }
            .history-card.is-favorite {
                border-color: #f4b400;
            }
            .history-header {
                display: flex;
                justify-content: space-between;
                margin-bottom: 12px;
                font-size: 13px;
                color: var(--muted);
            }
            .mode-badge {
                background: #e8f0fe;
                color: #1967d2;
                padding: 4px 8px;
                border-radius: 6px;
                font-weight: 600;
                text-transform: uppercase;
            }
            .text-block {
                margin-bottom: 12px;
            }
            .label {
                font-size: 12px;
                font-weight: 600;
                color: #9aa0a6;
                text-transform: uppercase;
                margin-bottom: 4px;
            }
            .content {
                font-size: 14px;
                line-height: 1.5;
                white-space: pre-wrap;
                background: var(--soft);
                padding: 12px;
                border-radius: 8px;
                font-family: inherit;
            }
            .content.result {
                background: var(--result);
                color: var(--result-text);
                border: 1px solid var(--border);
            }
            .empty {
                text-align: center;
                color: var(--muted);
                margin-top: 40px;
                font-size: 16px;
            }
            button {
                color: var(--text);
                background: var(--card);
                border: 1px solid var(--border);
                padding: 8px 12px;
                border-radius: 8px;
                cursor: pointer;
                font-weight: 500;
                transition: 0.2s;
            }
            button[aria-pressed='true'] {
                color: #8a5a00;
                background: #fff4ce;
                border-color: #f4b400;
            }
            button:focus-visible,
            input:focus-visible,
            select:focus-visible {
                outline: 3px solid rgba(26, 115, 232, 0.3);
                outline-offset: 2px;
            }
            button.clear-btn,
            .delete-btn {
                color: #d93025;
            }
            button.clear-btn:hover {
                background: #fce8e6;
            }
            button:disabled {
                cursor: progress;
                opacity: 0.62;
            }
            .card-actions {
                display: flex;
                gap: 8px;
                justify-content: flex-end;
            }
            .history-status {
                margin: -12px 0 18px;
                padding: 10px 12px;
                border: 1px solid var(--border);
                border-radius: 10px;
                background: var(--card);
                color: var(--muted);
                font-size: 14px;
            }
            .history-status:empty {
                display: none;
            }
            .history-status[data-kind='success'] {
                color: var(--result-text);
                background: var(--result);
            }
            .history-status[data-kind='error'] {
                color: #b42318;
                background: #fff1f0;
                border-color: #f1b8b3;
            }
            [data-theme='dark'] .history-status[data-kind='error'] {
                color: #ffb4ab;
                background: #4a2020;
                border-color: #7b3a36;
            }
            button.why-so-btn {
                color: var(--accent);
                border-color: color-mix(in srgb, var(--accent) 40%, var(--border));
                font-weight: 600;
            }
            button.why-so-btn:hover {
                background: color-mix(in srgb, var(--accent) 12%, transparent);
            }
            .explanation-block {
                margin-top: 14px;
                padding: 14px 16px;
                background: color-mix(in srgb, var(--accent) 7%, var(--card));
                border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border));
                border-radius: 10px;
                font-size: 13.5px;
                line-height: 1.55;
                animation: fadeIn 200ms ease;
            }
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(-4px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .explanation-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 10px;
                font-weight: 600;
                color: var(--accent);
                font-size: 13px;
            }
            .explanation-title {
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .explanation-content {
                white-space: pre-wrap;
                color: var(--text);
                line-height: 1.6;
            }
            .explanation-actions {
                display: flex;
                gap: 8px;
                align-items: center;
            }
            .explanation-btn {
                padding: 4px 10px;
                font-size: 12px;
                border-radius: 6px;
                background: transparent;
                border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
                color: var(--text);
                cursor: pointer;
                transition: background 150ms ease;
            }
            .explanation-btn:hover {
                background: color-mix(in srgb, var(--accent) 15%, transparent);
            }
            .explanation-loading {
                display: flex;
                align-items: center;
                gap: 8px;
                color: var(--muted);
                font-style: italic;
            }
            .secondary-btn:hover {
                background: #e8f0fe;
                color: #1967d2;
            }
            .delete-btn:hover {
                background: #fce8e6;
            }
            .hidden {
                display: none !important;
            }
            .history-export-format {
                max-width: 140px;
            }
            .history-filter-chips {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin: -12px 0 20px;
            }
            .history-chip {
                padding: 6px 14px;
                border-radius: 999px;
                border: 1px solid var(--border);
                background: var(--card);
                font-size: 12px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.15s ease;
                color: var(--text);
                font-family: inherit;
            }
            .history-chip:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            .history-chip.is-active {
                background: var(--accent);
                color: #ffffff;
                border-color: var(--accent);
            }
            .history-date-group-header {
                font-size: 12px;
                font-weight: 700;
                color: var(--accent);
                margin: 22px 0 10px;
                display: flex;
                align-items: center;
                gap: 10px;
                text-transform: uppercase;
                letter-spacing: 0.6px;
                user-select: none;
            }
            .history-date-group-header::after {
                content: '';
                flex: 1;
                height: 1px;
                background: var(--border);
                opacity: 0.6;
            }
            [data-ui-style='magicos-11'] {
                --bg: #dfeaff;
                --card: rgba(249, 252, 255, 0.62);
                --text: #17213a;
                --muted: #52617d;
                --border: rgba(255, 255, 255, 0.78);
                --soft: rgba(255, 255, 255, 0.46);
                --result: rgba(218, 247, 237, 0.7);
                --result-text: #176846;
                --accent: #4267f5;
            }
            [data-ui-style='magicos-11'][data-theme='dark'] {
                --bg: #11182a;
                --card: rgba(27, 36, 60, 0.7);
                --text: #f6f8ff;
                --muted: #b7c3dc;
                --border: rgba(255, 255, 255, 0.18);
                --soft: rgba(55, 70, 108, 0.46);
                --result: rgba(26, 86, 65, 0.56);
                --result-text: #9ee2c5;
                --accent: #9eb4ff;
            }
            [data-ui-style='magicos-11'] body {
                background:
                    radial-gradient(circle at 12% 8%, rgba(114, 154, 255, 0.68), transparent 34%),
                    radial-gradient(circle at 88% 16%, rgba(110, 225, 242, 0.46), transparent 31%),
                    radial-gradient(circle at 68% 92%, rgba(170, 120, 255, 0.36), transparent 38%), var(--bg);
                background-attachment: fixed;
            }
            [data-ui-style='magicos-11'] .history-card,
            [data-ui-style='magicos-11'] .toolbar input,
            [data-ui-style='magicos-11'] .toolbar select,
            [data-ui-style='magicos-11'] button,
            [data-ui-style='magicos-11'] .content {
                border-color: var(--border);
                border-radius: 20px;
                box-shadow:
                    0 14px 36px rgba(37, 59, 116, 0.16),
                    inset 0 1px 0 rgba(255, 255, 255, 0.58);
                backdrop-filter: blur(24px) saturate(170%);
                -webkit-backdrop-filter: blur(24px) saturate(170%);
            }
            [data-ui-style='magicos-11'] button,
            [data-ui-style='magicos-11'] .mode-badge {
                border-radius: 999px;
            }

            [data-ui-style='material-3'] {
                --bg: #f4f6f8;
                --card: #fff;
                --text: #1d1b20;
                --muted: #49454f;
                --border: #c8cdd4;
                --soft: #f1f3f6;
                --accent: #6750a4;
            }
            [data-ui-style='material-3'][data-theme='dark'] {
                --bg: #15171a;
                --card: #1d2024;
                --text: #f2f4f7;
                --muted: #c5cad1;
                --border: #454b54;
                --soft: #272b30;
                --accent: #c7b8ff;
            }
            [data-ui-style='material-3'] .history-card {
                border-radius: 24px;
                box-shadow: 0 3px 8px rgba(29, 25, 43, 0.14);
            }
            [data-ui-style='material-3'] button,
            [data-ui-style='material-3'] input,
            [data-ui-style='material-3'] select,
            [data-ui-style='material-3'] .content {
                border-radius: 16px;
            }
            [data-ui-style='flutter'] {
                --bg: #eef5fb;
                --card: #fff;
                --text: #17212b;
                --muted: #607080;
                --border: #d7e0e8;
                --soft: #f1f6fb;
                --accent: #1976d2;
            }
            [data-ui-style='flutter'][data-theme='dark'] {
                --bg: #161b20;
                --card: #20252b;
                --text: #f3f6f9;
                --muted: #aebbc7;
                --border: #43505c;
                --soft: #2b333b;
                --accent: #64b5f6;
            }
            [data-ui-style='flutter'] .history-card {
                border-radius: 10px;
                box-shadow: 0 7px 18px rgba(32, 73, 105, 0.12);
            }
            [data-ui-style='aurora-glass'] {
                --bg: #dff6ef;
                --card: rgba(248, 255, 252, 0.78);
                --text: #183d39;
                --muted: #58746f;
                --border: rgba(255, 255, 255, 0.84);
                --soft: rgba(233, 250, 245, 0.74);
                --accent: #0d9d8a;
            }
            [data-ui-style='aurora-glass'][data-theme='dark'] {
                --bg: #0b292d;
                --card: rgba(18, 47, 52, 0.82);
                --text: #e9fffa;
                --muted: #b5d2cc;
                --border: rgba(196, 255, 245, 0.2);
                --soft: rgba(40, 82, 83, 0.72);
                --accent: #65dfc8;
            }
            [data-ui-style='aurora-glass'] body {
                background:
                    radial-gradient(circle at 12% 4%, rgba(76, 219, 183, 0.58), transparent 36%),
                    radial-gradient(circle at 88% 90%, rgba(86, 168, 255, 0.42), transparent 42%), var(--bg);
                background-attachment: fixed;
            }
            [data-ui-style='aurora-glass'] .history-card {
                border-radius: 18px;
                box-shadow:
                    0 16px 36px rgba(23, 108, 98, 0.18),
                    inset 0 1px 0 rgba(255, 255, 255, 0.7);
                backdrop-filter: blur(20px) saturate(145%);
                -webkit-backdrop-filter: blur(20px) saturate(145%);
            }
            [data-ui-style='aurora-glass'] button,
            [data-ui-style='aurora-glass'] input,
            [data-ui-style='aurora-glass'] select,
            [data-ui-style='aurora-glass'] .content {
                border-radius: 12px;
            }
            [data-ui-style='vision-aurora'] {
                --bg: #e8f4fa;
                --card: rgba(247, 252, 255, 0.78);
                --text: #10233b;
                --muted: #52667c;
                --border: rgba(255, 255, 255, 0.9);
                --soft: rgba(233, 245, 250, 0.78);
                --accent: #0f766e;
            }
            [data-ui-style='vision-aurora'][data-theme='dark'] {
                --bg: #101a29;
                --card: rgba(18, 31, 48, 0.84);
                --text: #edf7ff;
                --muted: #b3c3d6;
                --border: rgba(255, 255, 255, 0.17);
                --soft: rgba(42, 62, 86, 0.72);
                --accent: #5eead4;
            }
            [data-ui-style='vision-aurora'] body {
                background:
                    radial-gradient(circle at 8% 8%, rgba(94, 234, 212, 0.45), transparent 36%),
                    radial-gradient(circle at 94% 88%, rgba(129, 140, 248, 0.38), transparent 42%), var(--bg);
                background-attachment: fixed;
            }
            [data-ui-style='vision-aurora'] .history-card {
                border-radius: 18px;
                box-shadow:
                    0 16px 38px rgba(28, 68, 99, 0.16),
                    inset 0 1px 0 rgba(255, 255, 255, 0.68);
                backdrop-filter: blur(22px) saturate(155%);
                -webkit-backdrop-filter: blur(22px) saturate(155%);
            }
            [data-ui-style='vision-aurora'] button,
            [data-ui-style='vision-aurora'] input,
            [data-ui-style='vision-aurora'] select,
            [data-ui-style='vision-aurora'] .content {
                border-radius: 12px;
            }

            [data-ui-style='silk-obsidian'] {
                --bg: #f7f8fc;
                --card: #ffffff;
                --text: #172033;
                --muted: #637087;
                --border: #e0e5ef;
                --soft: #f3f5fa;
                --accent: #4f46e5;
            }
            [data-ui-style='silk-obsidian'][data-theme='dark'] {
                --bg: #0c0e14;
                --card: #151923;
                --text: #f4f7fc;
                --muted: #aeb9c9;
                --border: rgba(255, 255, 255, 0.13);
                --soft: #1d2330;
                --accent: #a5b4fc;
            }
            [data-ui-style='silk-obsidian'] .history-card {
                border-radius: 12px;
                box-shadow: 0 10px 24px rgba(23, 32, 51, 0.1);
            }
            [data-ui-style='silk-obsidian'] button,
            [data-ui-style='silk-obsidian'] input,
            [data-ui-style='silk-obsidian'] select,
            [data-ui-style='silk-obsidian'] .content {
                border-radius: 9px;
            }
            @media (max-width: 720px) {
                body {
                    padding: 20px;
                }
                .toolbar {
                    grid-template-columns: 1fr;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                button,
                .explanation-block {
                    transition: none;
                    animation: none;
                }
            }

            .history-view-tabs {
                display: flex;
                gap: 8px;
                margin-bottom: 20px;
                border-bottom: 1px solid var(--border);
                padding-bottom: 10px;
            }
            .history-tab-btn {
                background: transparent;
                border: 1px solid transparent;
                border-radius: 8px;
                padding: 8px 16px;
                font-size: 14px;
                font-weight: 600;
                color: var(--muted);
                cursor: pointer;
                transition: all 0.15s ease;
            }
            .history-tab-btn:hover {
                color: var(--text);
                background: var(--soft);
            }
            .history-tab-btn.is-active {
                color: #ffffff;
                background: #1967d2;
                border-color: #1967d2;
            }
            [data-theme='dark'] .history-tab-btn.is-active {
                color: #12131a;
                background: #8ab4f8;
                border-color: #8ab4f8;
            }
            .grammar-analytics-view {
                display: flex;
                flex-direction: column;
                gap: 20px;
            }
            .grammar-analytics-view[hidden],
            [hidden] {
                display: none !important;
            }
            .analytics-hero-card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 16px;
                padding: 24px;
                display: flex;
                align-items: center;
                gap: 24px;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            }
            .score-circle {
                width: 90px;
                height: 90px;
                border-radius: 50%;
                background: radial-gradient(circle, color-mix(in srgb, var(--accent) 15%, transparent), transparent);
                border: 4px solid var(--accent);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }
            .score-number {
                font-size: 26px;
                font-weight: 800;
                color: var(--accent);
                line-height: 1;
            }
            .score-label {
                font-size: 11px;
                color: var(--muted);
                margin-top: 2px;
            }
            .hero-info h2 {
                margin: 0 0 6px;
                font-size: 18px;
                color: var(--text);
            }
            .hero-info p {
                margin: 0;
                color: var(--muted);
                font-size: 13.5px;
                line-height: 1.45;
            }
            .analytics-metrics-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                gap: 14px;
            }
            .metric-box {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .metric-val {
                font-size: 22px;
                font-weight: 700;
                color: var(--text);
            }
            .metric-desc {
                font-size: 12px;
                color: var(--muted);
            }
            .analytics-section-title {
                font-size: 16px;
                font-weight: 700;
                margin: 8px 0 2px;
                color: var(--text);
            }
            .analytics-breakdown-card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 20px;
            }
            .breakdown-row {
                display: flex;
                flex-direction: column;
                gap: 6px;
                padding: 10px 0;
                border-bottom: 1px solid var(--border);
            }
            .breakdown-row:last-child {
                border-bottom: none;
                padding-bottom: 0;
            }
            .breakdown-header {
                display: flex;
                justify-content: space-between;
                font-size: 13.5px;
            }
            .breakdown-name {
                display: flex;
                align-items: center;
                gap: 8px;
                font-weight: 600;
                color: var(--text);
            }
            .breakdown-count {
                color: var(--muted);
                font-size: 12.5px;
            }
            .breakdown-bar-wrap {
                width: 100%;
                height: 7px;
                background: var(--soft);
                border-radius: 4px;
                overflow: hidden;
            }
            .breakdown-bar-fill {
                height: 100%;
                border-radius: 4px;
                transition: width 0.4s ease;
            }
            .rules-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
                gap: 14px;
            }
            .rule-card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .rule-card-header {
                display: flex;
                align-items: center;
                gap: 8px;
                font-weight: 700;
                font-size: 14px;
                color: var(--text);
            }
            .rule-card-hint {
                font-size: 12.5px;
                color: var(--muted);
                line-height: 1.45;
            }
            .rule-card-example {
                margin-top: auto;
                padding: 8px 10px;
                background: var(--soft);
                border-radius: 8px;
                font-size: 12px;
                color: var(--accent);
                font-weight: 500;
            }
            .history-bulk-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 10px 16px;
                margin-bottom: 16px;
                background: color-mix(in srgb, var(--accent) 12%, var(--card));
                border: 1px solid var(--accent);
                border-radius: 10px;
                gap: 12px;
            }
            .bulk-bar-left {
                display: flex;
                align-items: center;
            }
            .bulk-select-all-label {
                display: flex;
                align-items: center;
                gap: 8px;
                font-weight: 600;
                font-size: 13.5px;
                cursor: pointer;
            }
            .bulk-bar-actions {
                display: flex;
                gap: 8px;
            }
            .bulk-btn {
                padding: 6px 14px;
                border-radius: 6px;
                border: 1px solid var(--border);
                background: var(--card);
                color: var(--text);
                cursor: pointer;
                font-size: 12.5px;
                font-weight: 600;
                transition: background 0.15s;
            }
            .bulk-btn:hover {
                background: var(--soft);
            }
            .bulk-btn.danger {
                background: #e53935;
                color: #fff;
                border-color: #d32f2f;
            }
            .bulk-btn.danger:hover {
                background: #c62828;
            }
            .history-card-select-cb {
                margin-right: 8px;
                cursor: pointer;
                accent-color: var(--accent);
            }
            .history-search-match {
                background: #ffe066;
                color: #111;
                border-radius: 3px;
                padding: 1px 3px;
                font-weight: 600;
            }
            .top-fixes-chips {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 10px;
            }
            .top-fix-chip {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 20px;
                padding: 5px 12px;
                font-size: 12.5px;
            }
            .top-fix-orig {
                color: #ef4444;
                text-decoration: line-through;
            }
            .top-fix-arrow {
                color: var(--muted);
            }
            .top-fix-res {
                color: #10b981;
                font-weight: 600;
            }
            .top-fix-count {
                background: var(--soft);
                border-radius: 10px;
                padding: 1px 6px;
                font-size: 11px;
                color: var(--muted);
            }
        </style>
    </head>
    <body>
        <main class="container">
            <h1 data-i18n="historyTitle">История запросов</h1>

            <div
                class="history-view-tabs"
                role="tablist"
                aria-label="Вкладки истории"
                data-i18n-aria-label="historyTitle"
            >
                <button
                    id="tabHistoryList"
                    class="history-tab-btn is-active"
                    type="button"
                    role="tab"
                    aria-selected="true"
                    aria-controls="historyListView"
                    tabindex="0"
                    data-i18n="historyTabRequests"
                >
                    📜 Список запросов
                </button>
                <button
                    id="tabGrammarAnalytics"
                    class="history-tab-btn"
                    type="button"
                    role="tab"
                    aria-selected="false"
                    aria-controls="grammarAnalyticsView"
                    tabindex="-1"
                    data-i18n="historyTabAnalytics"
                >
                    📊 Аналитика грамотности
                </button>
            </div>

            <!-- Раздел списка запросов -->
            <div id="historyListView" role="tabpanel" aria-labelledby="tabHistoryList">
                <div class="toolbar">
                    <input
                        id="historySearch"
                        type="search"
                        placeholder="Поиск по истории…"
                        data-i18n-placeholder="historySearch"
                    />
                    <select id="modeFilter" aria-label="Все операции" data-i18n-aria-label="allOperations">
                        <option value="all" data-i18n="allOperations">Все операции</option>
                        <option value="spellcheck" data-i18n="modeSpellcheck">Ошибки</option>
                        <option value="style" data-i18n="modeStyle">Стиль</option>
                        <option value="emoji" data-i18n="modeEmoji">Эмодзи</option>
                        <option value="layout" data-i18n="modeLayout">Раскладка</option>
                        <option value="translate" data-i18n="modeTranslate">Перевод</option>
                        <option value="summary" data-i18n="summaryShort">Выжимка</option>
                        <option value="tone" data-i18n="modeTone">Тональность</option>
                        <option value="continue" data-i18n="modeContinue">Дописать</option>
                        <option value="notes_to_doc" data-i18n="modeNotesToDoc">Заметки в текст</option>
                        <option value="headline" data-i18n="modeHeadline">Заголовки</option>
                        <option value="reply" data-i18n="modeReply">Ответ</option>
                        <option value="explain" data-i18n="modeExplain">Объяснить</option>
                        <option value="format" data-i18n="modeFormat">Формат</option>
                        <option value="ocr">OCR</option>
                        <option value="custom" data-i18n="modeCustom">Команда</option>
                    </select>
                    <select id="historySort" aria-label="Sort history" data-i18n-aria-label="historySort">
                        <option value="newest" data-i18n="historySortNewest">Newest first</option>
                        <option value="oldest" data-i18n="historySortOldest">Oldest first</option>
                        <option value="favorites" data-i18n="historySortFavorites">Favorites first</option>
                    </select>
                    <button id="favoriteFilter" type="button" aria-pressed="false" data-i18n="favoritesOnly">
                        Только избранное
                    </button>
                    <button id="resetFilterBtn" type="button" data-i18n="resetFilters">Сбросить фильтры</button>
                    <select id="exportFormatSelect" class="history-export-format" aria-label="Формат экспорта">
                        <option value="json">JSON (.json)</option>
                        <option value="csv">CSV (.csv)</option>
                        <option value="md">Markdown (.md)</option>
                    </select>
                    <button id="exportBtn" data-i18n="export">Экспорт</button>
                    <button id="importBtn" data-i18n="import">Импорт</button>
                    <input id="importFileInput" class="hidden" type="file" accept="application/json,.json" />
                    <button id="clearBtn" class="clear-btn" data-i18n="clear">Очистить</button>
                </div>

                <div class="history-filter-chips" id="historyFilterChips" role="group" aria-label="Быстрые фильтры">
                    <button type="button" class="history-chip is-active" data-filter="all" data-i18n="allOperations">
                        Все
                    </button>
                    <button type="button" class="history-chip" data-filter="spellcheck" data-i18n="modeSpellcheck">
                        Ошибки
                    </button>
                    <button type="button" class="history-chip" data-filter="style" data-i18n="modeStyle">Стиль</button>
                    <button type="button" class="history-chip" data-filter="translate" data-i18n="modeTranslate">
                        Перевод
                    </button>
                    <button type="button" class="history-chip" data-filter="summary" data-i18n="summaryShort">
                        Выжимка
                    </button>
                    <button type="button" class="history-chip" data-filter="favorites" data-i18n="favoritesOnly">
                        Избранное
                    </button>
                </div>

                <p id="historyStatus" class="history-status" role="status" aria-live="polite" aria-atomic="true"></p>
                <div class="history-bulk-bar" id="historyBulkBar" hidden>
                    <div class="bulk-bar-left">
                        <label class="bulk-select-all-label">
                            <input type="checkbox" id="bulkSelectAll" />
                            <span id="bulkSelectedCount" data-i18n="bulkSelectedLabel">Выбрано: 0</span>
                        </label>
                    </div>
                    <div class="bulk-bar-actions">
                        <button type="button" id="bulkExportCsvBtn" class="bulk-btn" data-i18n="exportSelectedCsv">
                            Экспорт в CSV
                        </button>
                        <button type="button" id="bulkDeleteBtn" class="bulk-btn danger" data-i18n="deleteSelected">
                            Удалить выбранные
                        </button>
                    </div>
                </div>
                <div id="historyList"></div>
            </div>

            <!-- Раздел аналитики грамотности -->
            <div
                id="grammarAnalyticsView"
                class="grammar-analytics-view"
                role="tabpanel"
                aria-labelledby="tabGrammarAnalytics"
                hidden
            >
                <div class="analytics-hero-card">
                    <div class="score-circle">
                        <span id="analyticsScoreVal" class="score-circle-num">100%</span>
                        <span class="score-circle-label">Грамотность</span>
                    </div>
                    <div class="analytics-hero-info">
                        <h2 id="analyticsScoreTitle" data-i18n="literacyStatusGreat">Отличная грамотность текстов</h2>
                        <p id="analyticsScoreDesc" data-i18n="literacyScoreDesc">
                            Индекс рассчитан на основе чистоты формулировок и количества исправлений в вашей истории.
                        </p>
                    </div>
                </div>

                <div class="analytics-metrics-grid">
                    <div class="metric-box">
                        <span id="analyticsTotalRequests" class="metric-val">0</span>
                        <span class="metric-desc" data-i18n="statTotalRequests">Всего проверок</span>
                    </div>
                    <div class="metric-box">
                        <span id="analyticsTotalFixes" class="metric-val">0</span>
                        <span class="metric-desc" data-i18n="statTotalFixes">Исправлено неточностей</span>
                    </div>
                    <div class="metric-box">
                        <span id="analyticsCleanRequests" class="metric-val">0</span>
                        <span class="metric-desc" data-i18n="statCleanRequests">Текстов без ошибок</span>
                    </div>
                </div>

                <div id="topWordFixesSection" class="analytics-breakdown-card" style="margin-top: 14px" hidden>
                    <h3
                        class="analytics-section-title"
                        data-i18n="topMistakesTitle"
                        style="margin-top: 0; margin-bottom: 8px"
                    >
                        Частые исправления
                    </h3>
                    <div id="topWordFixesList" class="top-fixes-chips"></div>
                </div>

                <h3 class="analytics-section-title" data-i18n="errorBreakdownTitle">Распределение частых ошибок</h3>
                <div class="analytics-breakdown-card">
                    <div id="analyticsBreakdownList"></div>
                </div>

                <h3 class="analytics-section-title" data-i18n="ruleCardsTitle">Памятка правил русского языка</h3>
                <div id="analyticsRulesGrid" class="rules-grid"></div>
            </div>
        </main>
        <script type="module" src="/src/history.ts"></script>
    </body>
</html>
